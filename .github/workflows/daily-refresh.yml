name: Daily site refresh

on:
  schedule:
    # 6:00 AM IST = 00:30 UTC
    - cron: "30 0 * * *"
  workflow_dispatch: # manual "Run workflow" button in GitHub

permissions:
  contents: write

jobs:
  refresh-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run daily refresh
        run: python scripts/refresh.py

      - name: Commit updated data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Daily refresh ${{ github.run_number }}"
          file_pattern: "data/* jobs.csv"
          skip_fetch: false

      # GitHub Action commits don't always trigger Netlify auto-deploy — ping build hook instead.
      - name: Trigger Netlify rebuild
        env:
          NETLIFY_BUILD_HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK" ]; then
            echo "⚠️ NETLIFY_BUILD_HOOK secret not set — add it in GitHub repo Settings → Secrets"
            exit 0
          fi
          curl -fsS -X POST -d {} "$NETLIFY_BUILD_HOOK"
          echo "Netlify rebuild triggered"
